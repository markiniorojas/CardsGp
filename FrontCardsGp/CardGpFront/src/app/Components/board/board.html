<!-- board.html -->
<div class="board">
  <div class="players left">
    <app-player-panel 
      *ngFor="let p of players.slice(0,3)" 
      [name]="p.name"
      [avatar]="p.avatar"
      [cardsCount]="p.cards"
      [isCurrent]="p.name === 'polit01'">
    </app-player-panel>
  </div>

  <div class="center-cards">
    <ng-container *ngFor="let card of battleCards; let i = index">
      <div class="battle-slot" [class.has-card]="card !== null">
        <div *ngIf="card; else emptySlot" class="battle-card-container">
          <img [src]="card.image" [alt]="card.name" class="battle-card-img" />
          <div class="card-name">{{ card.name }}</div>
        </div>
        <ng-template #emptySlot>
          <div class="empty-slot">
            <span class="slot-number">{{ i + 1 }}</span>
          </div>
        </ng-template>
      </div>
    </ng-container>
  </div>

  <div class="players right">
    <app-player-panel 
      *ngFor="let p of players.slice(3)" 
      [name]="p.name"
      [avatar]="p.avatar"
      [cardsCount]="p.cards"
      [isCurrent]="false">
    </app-player-panel> 
  </div>
</div>

<!-- Card Carousel at Bottom -->
<app-card-carousel 
  [cards]="myCards"
  [selectedIndex]="selectedCardIndex"
  (cardSelected)="selectCard($event)">
</app-card-carousel>

<!-- Card Modal -->
<app-card-modal
  [isVisible]="isModalVisible"
  [cardData]="selectedModalCard"
  (close)="closeModal()"
  (cardLaunched)="launchCard($event)">
</app-card-modal>
