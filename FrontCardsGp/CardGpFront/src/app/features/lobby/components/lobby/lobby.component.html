<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

<div class="lobby-container">
  <!-- 🧠 Título principal -->
  <div class="header-section">
    <h1 class="lobby-title">🎮 Jugadores Habilitados</h1>
  </div>

  <!-- 📊 Contador de jugadores activos -->
  <div class="player-counter">
    <div class="counter-display">
      <span class="counter-number">{{ enabledPlayers.length }}</span>
      <span class="counter-text">/ 8</span>
    </div>
    <div class="counter-label">Jugadores Activos</div>
  </div>

  <!-- 👥 Lista de jugadores habilitados -->
  <div class="players-section" *ngIf="enabledPlayers.length > 0; else loading">
    <h3 class="section-title">
      <mat-icon class="userPlayers">groups</mat-icon>
      Lista de Jugadores Habilitados
    </h3>

    <div class="players-grid">
      <div class="player-card"
           *ngFor="let player of enabledPlayers"
           [class.locked]="player.id === 1"
           (click)="onPlayerClick(player)"
           [title]="player.id === 1 ? 'Este jugador no se puede deshabilitar' : 'Haz clic para deshabilitar'">
        <div class="player-avatar">
          <span class="player-icon">👤</span>
        </div>

        <div class="player-name">
          {{ player.userName }}
        </div>

        <div class="player-status">
          <mat-icon>check</mat-icon> Activo
        </div>
      </div>
    </div>
  </div>

  <!-- 🕐 Template de carga -->
  <ng-template #loading>
    <div class="loading-message">
      <mat-icon>hourglass_empty</mat-icon>
      Cargando jugadores...
    </div>
  </ng-template>

  <!-- 🧹 Botones de acción -->
  <div class="action-buttons">
    <button class="add-player-btn" (click)="enablePlayersFrom2To8()">
      <mat-icon>person_add</mat-icon>
      Habilitar jugadores del 2 al 8
    </button>

    <button class="clear-players-btn" (click)="disableAllExceptPlayer1()">
      <mat-icon>person_remove</mat-icon>
      Deshabilitar todos menos el jugador 1
    </button>
  </div>

  <!-- 🚀 Botón de iniciar juego -->
  <div class="start-section">
    <button class="start-button"
            [disabled]="enabledPlayers.length < 2">
      <mat-icon>rocket_launch</mat-icon>
      Iniciar Juego
    </button>

    <div class="start-hint" *ngIf="enabledPlayers.length < 2">
      🚫 Necesitas al menos 2 jugadores para iniciar.
    </div>
  </div>

  <!-- 🧾 Mensaje cuando solo queda jugador 1 -->
  <div class="start-section" *ngIf="enabledPlayers.length === 1 && enabledPlayers[0].id === 1">
    <div class="start-hint">
      ✅ Solo el jugador 1 sigue habilitado.
    </div>
  </div>
</div>
